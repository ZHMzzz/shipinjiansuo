listen_address: 127.0.0.1
port: 9670
query_prefix: ''
max_search_results: 100
feature_extractor_config:
  default:
    device: mps
    compile: false
    warmup: true
  deepinsight/insightface/buffalo_l/_unknown:
    device: cpu
    compile: false
    warmup: true
  hf/Qwen/Qwen3-VL-Embedding/2B:
    dtype: float16
    max_total_pixels: 1048576
    # server.py shares and warms ActionEngine's instance before accepting queries.
    warmup: false
search_target_order:
  - owlv2
  - insightface
